    .toast-in { animation: toastAnim 3s ease-in-out forwards; }

      0%{opacity:0;transform:translateX(100%);}

    }

  return { 'Content-Type':'application/json', 'Authorization':`Bearer ${SB_ANON}`, 'apikey': SB_ANON };
}

function syncProgress() {
  if (!user || !user.program) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushProgress, SYNC_DEBOUNCE_MS);
}

async function pushProgress() {
  if (!user || !user.program) return;
  try {
    const res = await fetch(progressUrl(), {
      method:'POST', headers: progressHeaders(),
      body: JSON.stringify({ userId:getUserId(), action:'save', progress:user.program }),
    });
    if (!res.ok) console.warn('progress save failed:', res.status);
  } catch (err) {
    console.warn('progress save error:', err.message);
  }
}

async function loadProgress() {
  try {
    const res = await fetch(progressUrl(), {
      method:'POST', headers: progressHeaders(),
      body: JSON.stringify({ userId:getUserId(), action:'get' }),
    });
    if (!res.ok) { console.warn('progress load failed:', res.status); return null; }
    const d = await res.json();
    const p = d.progress;
    return (p && typeof p === 'object' && p.level) ? p : null;
  } catch (err) {
    console.warn('progress load error:', err.message);
    return null;
  }
}

function getVisits() { return LS.get('eb_visits') || []; }
function addVisit(d) {
  const v = getVisits();
  if (!v.includes(d)) { v.push(d); LS.set('eb_visits', v); }
}

function getModeStats() { return LS.get('eb_modes') || {}; }
function incMode(m) {
  const s = getModeStats(); s[m] = (s[m]||0)+1; LS.set('eb_modes', s);
}

function getErrors() { return LS.get('eb_errors') || []; }
function pushError(cat) {
  const e = getErrors().filter(x => x !== cat);
  e.unshift(cat); LS.set('eb_errors', e.slice(0,10));
}

// ─── 4. GAMIFICATION ─────────────────────────────────────────────
// Kirish kunini belgilaydi (Progress'dagi 30 kunlik kalendar shundan o'qiydi).
// Streak'ga TEGMAYDI — streak o'rganish uchun beriladi, kirish uchun emas.
function registerVisit() {
  const today = todayStr();
  if (user.lastVisit === today) return;
  user.lastVisit = today;
  addVisit(today);
  saveUser();
}

// Streak faqat vazifa bajarilganda o'sadi. Sof funksiya — alohida test qilinadi.
// Qaytaradi: true, agar bugun birinchi marta hisoblangan bo'lsa.
function updateStreakOnTask() {
  const today = todayStr();
  if (user.lastTaskDay === today) return false;
  user.streak = user.lastTaskDay === dateStr(-1) ? (user.streak||0)+1 : 1;
  user.lastTaskDay = today;
  return true;
}

// Toshkent vaqti (UTC+5). UTC bo'lsa kun 05:00 da almashardi — kechqurun mashq qilgan
// foydalanuvchi ertasiga soat 04:00 gacha "bugun bajardim" holatida qolib ketardi.
const TZ_OFFSET_MS = 5 * 3600000;
function todayStr(offset=0) {
  return new Date(Date.now() + offset*86400000 + TZ_OFFSET_MS).toISOString().split('T')[0];
}
function dateStr(offset) { return todayStr(offset); }

function addXP(n) {
  user.xp = (user.xp||0) + n;
  checkAchievements();
  saveUser();
  floatXP(n);
}

function floatXP(n) {
  const el = document.createElement('div');
  el.className = 'xp-float absolute text-amber-400 font-bold text-base';
  el.style.cssText = 'top:70px;right:18px;';
  el.textContent = `+${n} XP`;
  document.getElementById('xp-layer').appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

// CEFR daraja — YAGONA haqiqat manbai. Faqat unit/daraja imtihonidan o'tib ko'tariladi.
function currentLevel() {
  return user.program?.level || user.level || 'A1';
}

// XP darajasi — faqat motivatsiya bari uchun. Darajaga TA'SIR QILMAYDI.
function xpLevel() {
  let lv = 'A1';
  for (const [l,x] of Object.entries(LEVEL_XP)) if ((user.xp||0) >= x) lv = l;
  return lv;
}
function nextLevel() {
  const i = LEVELS.indexOf(xpLevel());
  return i < LEVELS.length-1 ? LEVELS[i+1] : null;
}
function levelPct() {
  const cur = xpLevel(), nxt = nextLevel();
  if (!nxt) return 100;
  const a = LEVEL_XP[cur], b = LEVEL_XP[nxt];
  return Math.round(((user.xp||0)-a)/(b-a)*100);
}

function checkAchievements() {
  if (!user.achievements) user.achievements = [];
  ACHIEVEMENTS.forEach(a => {
    if (!user.achievements.includes(a.id) && a.check(user)) {
      user.achievements.push(a.id);
      saveUser();
      toast(`${a.emoji} Yutuq: ${a.title}`, 'achievement');
    }
  });
}

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  const cls = { info:'bg-slate-700 border-slate-600', success:'bg-emerald-900 border-emerald-600',
    error:'bg-red-900 border-red-600', achievement:'bg-indigo-900 border-indigo-500' };
  el.className = `toast-in px-4 py-2.5 rounded-xl border text-sm font-medium shadow-lg ${cls[type]||cls.info}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

// ── TTS: ingliz ovozi majburiy tanlanadi ──
// lang='en-US' faqat "iltimos" — tizim standart ovozi o'zbek/rus bo'lsa, brauzer
// inglizcha matnni o'sha ovoz bilan o'qiydi. Shuning uchun voice'ni o'zimiz tanlaymiz.
const EN_VOICE_PREF = [
  /Google (US|UK) English/i,                          // Chrome — eng yaxshi onlayn
  /Microsoft .*(Natural|Aria|Guy|Jenny|Ryan|Sonia)/i, // Windows 11 neural
  /Microsoft (Zira|David|Mark|Hazel)/i,               // Windows eski, lekin haqiqiy en
  /Samantha|Daniel|Karen|Moira/i,                     // Apple
];
const SPEECH_CHUNK = 160;   // Chrome ~15s/200 belgidan keyin sintezni to'xtatadi
let _enVoice = null, _voiceWarned = false;

function pickEnVoice() {
  const all = speechSynthesis.getVoices() || [];
  const en = all.filter(v => /^en([-_]|$)/i.test(v.lang || ''));
  if (!en.length) return null;
  for (const re of EN_VOICE_PREF) {
    const hit = en.find(v => re.test(v.name || ''));
    if (hit) return hit;
  }
  return en.find(v => /^en[-_]US/i.test(v.lang)) || en[0];
}

// getVoices() asinxron — sahifa yangi ochilganda ro'yxat bo'sh bo'ladi
function ensureVoices(cb) {
  _enVoice = _enVoice || pickEnVoice();
  if (_enVoice) return cb();
  let done = false;
  const go = () => { if (done) return; done = true; _enVoice = pickEnVoice(); cb(); };
  speechSynthesis.addEventListener?.('voiceschanged', go, { once: true });
  setTimeout(go, 1000);   // ba'zi brauzerlarda event umuman kelmaydi
}

// Markdown/emoji ovozga ketmasligi uchun ("asterisk asterisk...")
function cleanForSpeech(text) {
  return String(text)
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ' ')
    .replace(/[*_`#>]/g, '')
    .replace(/[—–]/g, ', ')
    .replace(/\s+/g, ' ')
    .replace(/\s+([,.!?])/g, '$1')
    .trim();
}

function chunkForSpeech(text) {
  const out = [];
  const push = (s) => { s = s.trim(); if (s) out.push(s); };
  // gap → vergul → so'z tartibida maydalaymiz
  text.split(/(?<=[.!?])\s+/).forEach(sent => {
    if (sent.length <= SPEECH_CHUNK) return push(sent);
    let buf = '';
    sent.split(/(?<=,)\s+|\s+/).forEach(part => {
      if ((buf + ' ' + part).trim().length > SPEECH_CHUNK) { push(buf); buf = part; }
      else buf = (buf + ' ' + part).trim();
    });
    push(buf);
  });
  return out.length ? out : [text];
}

function speakText(text) {
  if (!('speechSynthesis' in window)) { toast("Brauzeringiz audio qo'llamaydi", 'error'); return false; }
  const chunks = chunkForSpeech(cleanForSpeech(text));
  speechSynthesis.cancel();
  ensureVoices(() => {
    if (!_enVoice && !_voiceWarned) {
      _voiceWarned = true;
      toast("Qurilmangizda ingliz tili ovozi yo'q — sifat past bo'lishi mumkin", 'error');
    }
    let i = 0;
    const next = () => {
      if (i >= chunks.length) return;
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      if (_enVoice) u.voice = _enVoice;
      u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
      u.onend = next;
      speechSynthesis.speak(u);
    };
    // cancel() dan keyin darhol speak() qilinsa Chrome uni tashlab yuboradi
    setTimeout(next, 60);
  });
  return true;
}

// Har bir [AUDIO] tugmasini jonlantirish — renderAI() ishlatilgan HAR joyda chaqirilishi shart
function bindAudioButtons(root) {
  (root || document).querySelectorAll('.aud-btn').forEach(b => {
    b.onclick = () => speakText(b.dataset.audio);
  });
}

// ─── 4.5 DASTUR MEXANIZMI (PROGRAM) ──────────────────────────────
// Sof holat funksiyalari — UI'ga bog'liq emas, alohida test qilinadi.

function initProgram(level) {
  return {
    level: LEVELS.includes(level) ? level : 'A1',
    unitIndex: 0,
    taskIndex: 0,          // 0..TASKS_PER_UNIT-1 = vazifalar, TASKS_PER_UNIT = unit imtihoni
    current: null,
    passedUnits: [],
    doneToday: { date: todayStr(), count: 0 },
    calibration: { results: [], checked: false },
    levelExam: { pending: false, attempts: 0, remedial: 0 },
    lessonsSeen: [],       // darsi ko'rilgan unit id'lari
    weakUnits: [],         // vazifasi o'tkazib yuborilgan unitlar — imtihonda qaytariladi
    updatedAt: new Date().toISOString(),
  };
}

function getUnit() {
  const p = user.program;
  if (!p) return null;
  return (CURRICULUM[p.level] || [])[p.unitIndex] || null;
}

// Unit so'zlari — { en, uz, ipa }. Eski satr shaklini ham qabul qiladi (himoya uchun).
function unitWords(u) {
  if (!u || !Array.isArray(u.words)) return [];
  return u.words.map(w => typeof w === 'string'
    ? { en: w, uz: '', ipa: '' }
    : { en: w.en || '', uz: w.uz || '', ipa: w.ipa || '' });
}

// ── Mavzu darsi ──────────────────────────────────────────────────
// Unit boshida so'zlar va grammatika ko'rsatiladi. Bu AI chaqiruvi EMAS —
// lokal data, shuning uchun token ham, kutish ham yo'q.
function needsLesson() {
  const p = user.program;
  if (!p) return false;
  if (p.current) return false;
  if (p.levelExam.pending) return false;
  if (p.taskIndex !== 0) return false;
  const u = getUnit();
  if (!u) return false;
  return !(p.lessonsSeen || []).includes(u.id);
}

function markLessonSeen(unitId) {
  const p = user.program;
  if (!p || !unitId) return false;
  if (!Array.isArray(p.lessonsSeen)) p.lessonsSeen = [];
  if (p.lessonsSeen.includes(unitId)) return false;
  p.lessonsSeen.push(unitId);
  return true;
}

// Unit so'zlarini lug'atga ko'chiradi — dastur bilan shug'ullanuvchida
// takrorlash (SRS) birinchi kundanoq ishlashi uchun. XP bermaydi.
function seedUnitWords(u) {
  if (!u) return 0;
  if (!Array.isArray(user.vocabulary)) user.vocabulary = [];
  const have = new Set(user.vocabulary.map(v => String(v.word || '').toLowerCase()));
  const now = Date.now();
  let added = 0;
  for (const w of unitWords(u)) {
    if (!w.en || have.has(w.en.toLowerCase())) continue;
    user.vocabulary.push({
      word: w.en,
      translation: w.uz,
      pronunciation: w.ipa,
      mastery: 0,
      addedAt: new Date().toISOString(),
      nextReview: now,
    });
    have.add(w.en.toLowerCase());
    added++;
  }
  return added;
}

// Joriy qadam turi: vazifa turi, 'unit_exam' yoki 'level_exam'.
// CURRICULUM'da daraja hali yo'q bo'lsa null — UI "tayyorlanmoqda" ekranini ko'rsatadi.
function getTaskType() {
  const p = user.program;
  if (!p) return null;
  if (p.levelExam.pending) return p.levelExam.remedial > 0 ? 'translate' : 'level_exam';
  const u = getUnit();
  if (!u) return null;
  if (p.taskIndex >= TASKS_PER_UNIT) return 'unit_exam';
  return u.tasks[p.taskIndex] || 'translate';
}

// Kunlik hisob sanasi eskirgan bo'lsa nolga tushiradi.
function rollDaily() {
  const p = user.program;
  if (!p) return;
  const t = todayStr();
  if (p.doneToday.date !== t) p.doneToday = { date: t, count: 0 };
}

function canStartTask() {
  const p = user.program;
  if (!p) return { ok:false, reason:'no_program' };
  rollDaily();
  if (p.current) return { ok:false, reason:'open_task' };
  if (!getTaskType()) return { ok:false, reason:'level_not_ready' };
  if (p.doneToday.count >= MAX_DAILY_TASKS) return { ok:false, reason:'daily_limit' };
  return { ok:true, reason:null };
}

// Erkin mashqlar (6 ta rejim + AI Ustoz + Testlar) ochiqmi?
// Escape hatch'lar shart: dastursiz yoki vazifasiz holatda qulf abadiy bo'lib qoladi.
function freeModeGate() {
  const p = user.program;
  if (!p) return { ok:true, reason:'no_program', done:0, need:0 };
  rollDaily();
  if (!getTaskType()) return { ok:true, reason:'level_not_ready', done:0, need:0 };
  const need = Math.min(DAILY_QUOTA, MAX_DAILY_TASKS);
  const done = p.doneToday.count;
  if (done >= need) return { ok:true, reason:'quota_done', done, need };
  return { ok:false, reason:'quota_pending', done, need };
}

// Qulf matni. need=1 bo'lganda raqam ko'rsatilmaydi — dashboardda "bugun 0/3" bilan
// yonma-yon turganda ikki xil kasr chalkashtiradi.
function lockText(g) {
  return g.need > 1
    ? `Bugungi ${g.done}/${g.need} vazifa bajarilgach ochiladi`
    : 'Bugungi vazifani bajarsangiz ochiladi';
}

// Qulf paytida AI o'rniga qaytariladigan lokal matn — tarmoqqa chiqmaydi, token sarflamaydi.
function lockedReply(g) {
  return `🔒 **Avval bugungi vazifani bajaraylik.**

${lockText(g)}: suhbat, hikoya, grammatika, viktorina va matn tuzatish.

👉 Pastdagi ✍️ **Vazifalar** bo'limiga o'ting.`;
}

function issueTask(type, prompt) {
  const p = user.program;
  const u = getUnit();
  p.current = {
    unitId: u ? u.id : null,
    taskIndex: p.taskIndex,
    type,
    prompt,
    issuedAt: new Date().toISOString(),
    status: 'open',
    attempts: 0,
    relief: false,
    lastScore: null,
  };
  saveUser();
  return p.current;
}

// AI baholagan natijani qo'llaydi. PASS/FAIL ni AI emas, KLIENT hisoblaydi.
function applyResult(score) {
  const p = user.program;
  if (!p || !p.current) return { ok:false, reason:'no_task' };
  if (!score || !score.total) return { ok:false, reason:'no_score' };

  const ratio  = score.correct / score.total;
  const passed = ratio >= PASS_THRESHOLD;
  const type   = p.current.type;
  p.current.lastScore = score;

  // Kalibratsiya faqat BIRINCHI urinish natijasini oladi — qayta urinishlar hisobni buzmasin.
  if (p.current.attempts === 0) recordCalibration(ratio);

  if (passed) {
    p.current.status = 'passed';
    rollDaily();
    p.doneToday.count++;
    updateStreakOnTask();
    p.current = null;
    advance();
    addXP(XP_PER_TASK);   // addXP o'zi saveUser chaqiradi
    saveUser();
    return { ok:true, passed:true, ratio, type, attempts:0, relief:false };
  }

  // Daraja imtihonidan yiqilish — takror vazifalarga qaytaradi, urinish sanalmaydi.
  if (type === 'level_exam') {
    p.levelExam.attempts++;
    p.levelExam.remedial = REMEDIAL_TASKS;
    p.current = null;
    saveUser();
    return { ok:true, passed:false, ratio, type, remedial:REMEDIAL_TASKS };
  }

  p.current.status = 'failed';
  p.current.attempts++;
  if (p.current.attempts >= MAX_ATTEMPTS_BEFORE_RELIEF) p.current.relief = true;
  // Yengillashtirilgan variant ham yordam bermasa — o'quvchi tiqilib qolmasin.
  if (p.current.attempts >= MAX_ATTEMPTS_BEFORE_SKIP) p.current.canSkip = true;
  saveUser();
  return { ok:true, passed:false, ratio, type, attempts:p.current.attempts,
           relief:p.current.relief, canSkip:!!p.current.canSkip };
}

// Chiqish yo'li: vazifa o'tkazib yuboriladi, lekin XP berilmaydi va unit
// "o'zlashtirilmagan" deb belgilanadi — unit imtihonida qaytadan so'raladi.
function skipTask() {
  const p = user.program;
  if (!p || !p.current) return { ok:false, reason:'no_task' };
  if (!p.current.canSkip) return { ok:false, reason:'not_allowed' };

  const u = getUnit();
  if (u && !Array.isArray(p.weakUnits)) p.weakUnits = [];
  if (u && !p.weakUnits.includes(u.id)) p.weakUnits.push(u.id);

  const type = p.current.type;
  p.current = null;
  rollDaily();
  p.doneToday.count++;      // kunlik hisobga kiradi — erkin rejimlar ochiladi
  updateStreakOnTask();
  advance();
  saveUser();
  return { ok:true, skipped:true, type, unitId: u ? u.id : null };
}

// Muvaffaqiyatli qadamdan keyin dasturni oldinga suradi.
function advance() {
  const p = user.program;
  const units = CURRICULUM[p.level] || [];

  if (p.levelExam.pending) {
    if (p.levelExam.remedial > 0) { p.levelExam.remedial--; return; }
    levelUp();
    return;
  }

  if (p.taskIndex < TASKS_PER_UNIT) { p.taskIndex++; return; }

  // Unit imtihoni o'tdi
  const u = units[p.unitIndex];
  if (u && !p.passedUnits.includes(u.id)) p.passedUnits.push(u.id);
  p.taskIndex = 0;
  p.unitIndex++;
  if (p.unitIndex >= units.length) {
    p.unitIndex = Math.max(0, units.length - 1);
    p.levelExam.pending = true;
  }
}

function levelUp() {
  const p = user.program;
  const i = LEVELS.indexOf(p.level);
  p.levelExam = { pending:false, attempts:0, remedial:0 };
  if (i < LEVELS.length - 1) p.level = LEVELS[i+1];
  p.unitIndex = 0;
  p.taskIndex = 0;
  p.passedUnits = [];
}

function recordCalibration(ratio) {
  const c = user.program.calibration;
  if (c.checked || c.results.length >= CALIBRATION_TASKS) return;
  c.results.push(ratio);
}

// Dastlabki 3 vazifadan keyin darajani BIR MARTA tuzatadi.
// Qaytaradi: 'up' | 'down' | null — UI sababni tushuntirish uchun ishlatadi.
function calibrate() {
  const p = user.program;
  const c = p.calibration;
  if (c.checked || c.results.length < CALIBRATION_TASKS) return null;
  c.checked = true;

  // O'rtacha bo'yicha: "uchtasi ham 100%" sharti amalda deyarli ishlamasdi —
  // 5/5, 5/5, 4/5 olgan odam ham darajasidan yuqori turadi.
  const avg = c.results.reduce((s, r) => s + r, 0) / c.results.length;
  const strong = avg >= CALIBRATION_UP_AVG && c.results.every(r => r >= PASS_THRESHOLD);
  const weak   = avg < CALIBRATION_DOWN_AVG;
  const i = LEVELS.indexOf(p.level);
  let moved = null;

  if (strong && i < LEVELS.length-1 && CURRICULUM[LEVELS[i+1]]?.length) {
    p.level = LEVELS[i+1]; moved = 'up';
  } else if (weak && i > 0) {
    p.level = LEVELS[i-1]; moved = 'down';
  }
  if (moved) {
    p.unitIndex = 0; p.taskIndex = 0; p.current = null; p.passedUnits = [];
  }
  saveUser();
  return moved;
}

// Yo'l xaritasi — "qayerdaman / hozir nima / keyin nima" uchun yagona manba.
// Dastur ekrani, dashboard va kirish ekrani shu funksiyadan o'qiydi; UI'ga bog'liq emas.
// null qaytadi: dastur yo'q yoki daraja syllabusi hali yozilmagan.
function getRoadmap() {
  const p = user.program;
  if (!p) return null;
  const u = getUnit();
  if (!u) return null;

  const units    = CURRICULUM[p.level] || [];
  const inLevelExam = p.levelExam.pending;

  // Unit ichidagi 7 qadam: TASKS_PER_UNIT vazifa + unit imtihoni.
  const mk = (type, i, state) => {
    const l = taskLabel(type);
    return { i, type, emoji:l.emoji, title:l.title, state };
  };
  const stateOf = i => inLevelExam ? 'done'
    : i <  p.taskIndex ? 'done'
    : i === p.taskIndex ? 'current' : 'locked';

  const steps = u.tasks.slice(0, TASKS_PER_UNIT).map((t,i) => mk(t, i, stateOf(i)));
  steps.push(mk('unit_exam', TASKS_PER_UNIT, stateOf(TASKS_PER_UNIT)));

  const curIdx   = steps.findIndex(s => s.state === 'current');
  const nextUnit = units[p.unitIndex + 1] || null;
  const nextLvl  = LEVELS[Math.min(LEVELS.length - 1, LEVELS.indexOf(p.level) + 1)];

  let phase = 'unit', prev = null, current = null, next = null;

  if (inLevelExam) {
    phase   = p.levelExam.remedial > 0 ? 'remedial' : 'level_exam';
    current = phase === 'remedial'
      ? { ...taskLabel('translate'), title:`Takror vazifa (${p.levelExam.remedial} qoldi)` }
      : taskLabel('level_exam');
    prev = { title:`${p.level} — barcha unitlar` };
    next = { title: phase === 'remedial' ? 'Daraja imtihoni' : `${nextLvl} darajasi` };
  } else {
    prev = curIdx > 0 ? steps[curIdx - 1] : { title:'—' };
    current = curIdx >= 0 ? steps[curIdx] : null;
    next = curIdx >= 0 && curIdx < steps.length - 1
      ? steps[curIdx + 1]
      : { title: nextUnit ? `Yangi mavzu: ${nextUnit.title}` : 'Daraja imtihoni' };
    if (curIdx === TASKS_PER_UNIT) phase = 'unit_exam';
  }

  return {
    phase, steps, curIdx, prev, current, next,
    level: p.level,
    unitTitle: u.title,
    unitNo: p.unitIndex + 1,
    unitsTotal: units.length,
    unitsDone: p.passedUnits.length,
    nextUnitTitle: nextUnit ? nextUnit.title : null,
  };
}

// ─── 5. WORD PARSER ──────────────────────────────────────────────
function parseWords(text) {
  const re = /📌 \*\*(.+?)\*\*\s*(?:\((.+?)\))?\s*— (.+?)(?:\n|$)/g;
  let m, added = 0;
  if (!user.vocabulary) user.vocabulary = [];
  while ((m = re.exec(text)) !== null) {
    const word = m[1].trim(), pron = (m[2]||'').trim(), tr = m[3].trim();
    if (!user.vocabulary.find(v => v.word.toLowerCase()===word.toLowerCase())) {
      user.vocabulary.push({ word, translation:tr, pronunciation:pron, mastery:0,
        addedAt: new Date().toISOString(), nextReview: new Date().toISOString() });
      added++;
    }
  }
  if (added > 0) {
    addXP(added*5);
    toast(`📌 ${added} ta yangi so'z saqlandi!`, 'success');
  }
}

// ─── 6. TEXT RENDERER ────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function markup(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
}

function renderText(text) {
  const lines = text.split('\n');
  let html = '', cardBuf = [], normBuf = [];
  const CARD_STARTS = ['❌','✅','💡','🔁','🧩'];
  const isCard = l => CARD_STARTS.some(p => l.startsWith(p));

  function flushNorm() {
    const t = normBuf.join('\n').trim();
    if (t) html += `<div class="whitespace-pre-wrap leading-relaxed">${markup(t)}</div>`;
    normBuf = [];
  }
  function flushCard() {
    if (!cardBuf.length) return;
    html += `<div class="bg-amber-950 border border-amber-500 rounded-xl p-3 my-2 space-y-1 text-sm">`;
    cardBuf.forEach(l => { html += `<div>${markup(l)}</div>`; });
    html += `</div>`;
    cardBuf = [];
  }

  lines.forEach(l => {
    if (isCard(l)) { flushNorm(); cardBuf.push(l); }
    else           { flushCard(); normBuf.push(l); }
  });
  flushNorm(); flushCard();
  return html || `<div class="whitespace-pre-wrap">${markup(text)}</div>`;
}

// Extract [AUDIO]...[/AUDIO] blocks into hidden play buttons (IELTS Listening)
function renderAI(text) {
  const scripts = [];
  const stripped = text.replace(/\[AUDIO\]([\s\S]*?)\[\/AUDIO\]/g, (_, inner) => {
    scripts.push(inner.trim());
    return `\n[[AUDIO_${scripts.length-1}]]\n`;
  });
  let html = renderText(stripped);
  scripts.forEach((s, i) => {
    const btn = `<button class="aud-btn bg-indigo-600 hover:bg-indigo-500 rounded-lg px-3 py-2 text-sm my-1 inline-flex items-center gap-1" data-audio="${esc(s)}">🔊 Tinglash</button>`;
    html = html.replace(`[[AUDIO_${i}]]`, btn);
  });
  return { html, hasAudio: scripts.length > 0, firstScript: scripts[0] };
}

// ─── 7. CLAUDE API ───────────────────────────────────────────────
function onAISuccess(ai, opts={}) {
  // Dastur rejimida XP vazifa o'tganda beriladi (XP_PER_TASK) — bu yerda ikki marta sanamaymiz.
  if (!opts.program) {
    addXP(10);
    incMode(currentMode);
    if (currentMode === 'quiz')       user.quizCount       = (user.quizCount||0) + 1;
    if (currentMode === 'correction') user.correctionCount = (user.correctionCount||0) + 1;
    saveUser();
  }
  parseWords(ai);
  parseErrorCats(ai);
  if (ieltsActive() && !opts.program) parseBand(ai);
}

// Xato kategoriyalarini ajratish → "Zaif joylar" bloki (dashboard) va system promptga boradi
function parseErrorCats(text) {
  const re = /🧩 Mavzu:\s*(.+?)(?:\n|$)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const cat = m[1].trim().replace(/[*_]/g,'');
    if (cat && cat.length <= 40) pushError(cat);
  }
}

// Dastur vazifasi natijasi. Marker javob BOSHIDA — chat funksiyasi chiqishni 1000 token bilan
// cheklaydi, oxiridagi marker kesilib yo'qolardi va vazifa hech qachon PASS bo'lmasdi.
// PASS/FAIL ni AI emas, klient hisoblaydi (applyResult) — AI "PASS" so'ziga ishonilmaydi.
// Emoji va katta-kichik harf ixtiyoriy: model formatni bir oz buzsa ham
// o'quvchini "qayta yuboring" deb aylantirmaymiz. "NATIJA" so'zi va N/M shart.
function parseResult(text) {
  const m = String(text || '').match(/(?:📊\s*)?\**\s*NATIJA\s*:?\s*\**\s*(\d{1,3})\s*\/\s*(\d{1,3})/i);
  if (!m) return null;
  const correct = parseInt(m[1], 10), total = parseInt(m[2], 10);
  if (!total || correct > total) return null;
  return { correct, total };
}

function parseBand(text) {
  const m = text.match(/🎯 Band:\s*([0-9](?:\.[05])?)/);
  if (!m) return;
  if (!user.ielts) user.ielts = { targetBand: 6.5, scores: [] };
  user.ielts.scores.push({ section: currentMode, band: parseFloat(m[1]), date: todayStr() });
  if (user.ielts.scores.length > 50) user.ielts.scores = user.ielts.scores.slice(-50);
  saveUser();
}

// AI o'tganini eslashi uchun (language-tutor skillidagi "veди словарь в голове" prinsipi).
function programContext() {
  const p = user.program;
  if (!p) return '';
  const u = getUnit();
  const total = (CURRICULUM[p.level] || []).length;
  const lines = [`DASTUR: ${p.level} darajasi${total ? `, ${p.unitIndex + 1}/${total}-unit` : ''}`];
  if (u) {
    lines.push(`Unit ${u.id} — ${u.title}`);
    lines.push(`Maqsad: ${u.can}`);
    lines.push(`Grammatika: ${u.grammar}`);
    // Tarjima ETALON — AI o'zicha o'ylab topmasin, o'quvchi darsda ko'rgani bilan bir xil bo'lsin.
    lines.push(`Unit lug'ati (asosan SHULARDAN foydalan, tarjimasi AYNAN shunday): ${unitWords(u).map(w => `${w.en} — ${w.uz}`).join('; ')}`);
  }
  const learned = (user.vocabulary || []).slice(-VOCAB_IN_PROMPT).map(v => v.word);
  if (learned.length) {
    lines.push(`Allaqachon o'rgatilgan so'zlar (qayta ishlat, boshqatdan izohlama): ${learned.join(', ')}`);
  }
  const skipped = (user.program.weakUnits || []).slice(-3);
  if (skipped.length) {
    lines.push(`O'zlashtirilmagan unitlar (imtihonda albatta tekshir): ${skipped.join(', ')}`);
  }
  return lines.join('\n');
}

async function callAI(userMsg, opts={}) {
  // Qulf tekshiruvi tarixga yozishdan ham oldin — qulflangan xabar history'ga tushmasin.
  // opts.program chaqiruvlari hech qachon qulflanmaydi, aks holda dastur o'zini bloklaydi.
  if (!opts.program) {
    const g = freeModeGate();
    if (!g.ok) return lockedReply(g);
  }

  history.push({ role:'user', content: userMsg });
  if (history.length > MAX_HIST) history = history.slice(-MAX_HIST);

  try {
    const body = {
      userId: getUserId(),
      system: opts.program ? buildProgramSystem(opts.program) : buildSystem(currentMode),
      messages: history,
      mode: opts.program ? `program_${opts.program}` : currentMode,
      profile: { name:user.name, level:currentLevel(), goal:user.goal },
    };
    if (opts.audio) body.audio = opts.audio;
    const res = await fetch(`${SB_URL}/functions/v1/chat`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SB_ANON}`, 'apikey': SB_ANON },
      body: JSON.stringify(body),
    });

    const data = await res.json().catch(()=>({}));
    if (!res.ok) {
      history.pop();
      if (res.status===429) return '⏳ ' + (data.message || "Bugungi limit tugadi.");
      return `❌ ${data.message || 'Xatolik. Qayta urinib ko\'ring.'}`;
    }

    const ai = data.text || "❌ Bo'sh javob keldi.";
    history.push({ role:'assistant', content: ai });

    onAISuccess(ai, opts);
    return ai;

  } catch(err) {
    history.pop();
    if (err.name==='TypeError') return "📡 Internet aloqasi yo'q. Qayta urinib ko'ring.";
    return `❌ Xatolik: ${err.message}`;
  }
}

// ─── 7.5 DASTUR OQIMI (UI shu uchtasini chaqiradi) ───────────────
function isAiError(text) {
  return typeof text === 'string' && /^(❌|📡|⏳)/.test(text);
}

// navigator.onLine faqat "tarmoq bor" deydi, "internet bor" demaydi — shuning uchun
// undan faqat aniq OFFLINE holatni bilish uchun foydalanamiz, teskarisiga ishonmaymiz.
function isOffline() {
  return typeof navigator !== 'undefined' && navigator.onLine === false;
}

// Gapirish vazifasida AI nutqni eshitmaganini shu belgi bilan bildiradi.
// Bu bilim xatosi emas — urinish sanalmasligi kerak.
function isNoAudio(text) {
  return typeof text === 'string' && /\[AUDIO_YOQ\]/.test(text);
}

// Yangi vazifa: AI dan matn so'raydi va program.current ga yozadi.
async function startTask() {
  const gate = canStartTask();
  if (!gate.ok) return { ok:false, reason:gate.reason };
  const type = getTaskType();
  history = [];
  const text = await callAI('Vazifani ber.', { program:'issue' });
  if (isAiError(text)) return { ok:false, reason:'ai_error', message:text };
  issueTask(type, text);
  return { ok:true, type, prompt:text };
}

// Qayta urinish. 1-2 urinishda ayni vazifa qoladi; 3-dan keyin AI yengillashtirilgan variant beradi.
async function retryTask() {
  const p = user.program;
  if (!p?.current || p.current.status !== 'failed') return { ok:false, reason:'no_failed_task' };
  if (!p.current.relief) {
    p.current.status = 'open';
    saveUser();
    return { ok:true, eased:false, type:p.current.type, prompt:p.current.prompt };
  }
  history = [];
  const text = await callAI('Yengillashtirilgan variantni ber.', { program:'issue' });
  if (isAiError(text)) return { ok:false, reason:'ai_error', message:text };
  p.current.prompt = text;
  p.current.status = 'open';
  saveUser();
  return { ok:true, eased:true, type:p.current.type, prompt:text };
}

// Javobni tekshiruvga yuboradi. PASS/FAIL ni klient hisoblaydi (applyResult).
// audio berilsa (gapirish vazifasi) — matn o'rniga ovoz yuboriladi.
async function submitTask(answer, audio) {
  const p = user.program;
  if (!p?.current) return { ok:false, reason:'no_task' };
  if (!audio && (!answer || !answer.trim())) return { ok:false, reason:'empty_answer' };

  p.current.status = 'submitted';
  saveUser();
  history = [];
  const opts = { program:'check' };
  if (audio) opts.audio = audio;
  const text = await callAI(answer || '🎤 [Ovozli javob]', opts);

  if (isAiError(text)) {
    p.current.status = 'open';   // tarmoq/AI xatosi — urinish sanalmaydi
    saveUser();
    return { ok:false, reason:'ai_error', message:text };
  }

  // Mikrofon ishlamagan yoki nutq eshitilmagan — bu bilim xatosi emas, urinish sanalmaydi.
  if (isNoAudio(text)) {
    p.current.status = 'open';
    saveUser();
    return { ok:false, reason:'no_audio', text };
  }

  const score = parseResult(text);
  if (!score) {
    // Marker yo'q (javob kesilgan yoki AI formatni buzgan) — urinish sanalmaydi, XP berilmaydi.
    return { ok:false, reason:'no_marker', text };
  }

  const r = applyResult(score);
  // Yiqilgan vazifa izohi saqlanadi — sahifa yangilansa ham xatolar ko'rinib turadi.
  if (!r.passed && p.current) { p.current.feedback = text; saveUser(); }
  return { ok:true, text, score, ...r };
}

// Chiqish yo'li: AI to'g'ri javoblarni tushuntiradi, so'ng vazifa o'tkazib yuboriladi.
// AI javob bermasa ham o'tkazib yuboriladi — aks holda o'quvchi yana tiqilib qoladi.
async function revealAndSkip() {
  const p = user.program;
  if (!p?.current) return { ok:false, reason:'no_task' };
  if (!p.current.canSkip) return { ok:false, reason:'not_allowed' };

  history = [];
  const text = await callAI("To'g'ri javoblarni ko'rsat.", { program:'reveal' });
  const ok = !isAiError(text);
  const r = skipTask();
  if (!r.ok) return r;
  return { ok:true, skipped:true, text: ok ? text : null, unitId:r.unitId };
}

function ieltsLocked() {
  return user.goal === 'ielts' && LEVELS.indexOf(currentLevel()) < LEVELS.indexOf(IELTS_MIN_LEVEL);

  if (typeof teardownRec === 'function') teardownRec();
  if (tab === 'home') return renderDashboard();
  if (tab === 'ai')   { currentMode = 'conversation'; history = []; return renderChat(); }
  if (tab === 'tasks') { lessonOpen = false; return renderProgram(); }
  if (tab === 'tests') { currentMode = 'quiz'; history = []; return renderChat(); }
  if (tab === 'progress') return renderProgress();
}

// ─── VIEW: DASTUR (Vazifalar) ────────────────────────────────────
let programFeedback = null;   // oxirgi PASS izohi — bir marta ko'rsatiladi
let programBusy = false;
let lessonOpen = false;       // mavzu darsi qo'lda ochilganmi
let programFeedbackKind = 'pass';   // 'pass' | 'skip'

function taskLabel(type) {
  if (type === 'unit_exam')  return { emoji:'📋', title:'Unit imtihoni',   desc:"Butun unit bo'yicha 8 savol" };
  if (type === 'level_exam') return { emoji:'🏆', title:'Daraja imtihoni', desc:'Darajani tasdiqlaydigan 10 savol' };
  return TASK_TYPES[type] || { emoji:'📝', title:'Vazifa', desc:'' };
}

function programHeader() {
  const p = user.program;
  const u = getUnit();
  const units = CURRICULUM[p.level] || [];
  const done = p.passedUnits.length;
  const pct = units.length ? Math.round(done / units.length * 100) : 0;
  const step = Math.min(p.taskIndex + 1, TASKS_PER_UNIT + 1);
  const stepTxt = p.levelExam.pending
    ? (p.levelExam.remedial > 0 ? `Takror vazifa (${p.levelExam.remedial} qoldi)` : 'Daraja imtihoni')
    : (p.taskIndex >= TASKS_PER_UNIT ? 'Unit imtihoni' : `${step}/${TASKS_PER_UNIT} vazifa`);

  return `
  <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 mb-4">
    <div class="flex justify-between items-start mb-2">
      <div>
        <div class="text-xs text-slate-400">${p.level} darajasi · ${done}/${units.length} unit</div>
        <div class="font-semibold text-sm mt-0.5">${u ? esc(u.title) : '—'}</div>
      </div>
      <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-1 rounded-lg whitespace-nowrap">${stepTxt}</span>
    </div>
    ${u ? `<div class="text-xs text-slate-400 mb-2">🎯 ${esc(u.can)}</div>
    <div class="text-xs text-slate-500 mb-2">📐 ${esc(u.grammar)}</div>
    <button id="pg-lesson" class="text-xs bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-1.5 mb-3 transition-colors">📖 Mavzu darsi va so'zlar</button>` : ''}
    <div class="bg-slate-700 rounded-full h-1.5">
      <div class="bg-indigo-500 h-1.5 rounded-full" style="width:${pct}%"></div>
    </div>
    ${roadmapStrip(getRoadmap())}
  </div>`;
}

// Unit ichidagi qadamlar chizig'i: ●━●━○━○━○━○━🏁
// Bajarilgan yashil, joriy indigo va halqali, qolgani kulrang qulfda.
function roadmapStrip(rm) {
  if (!rm) return '';
  const dot = s => {
    const base = 'w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0';
    const face = s.type === 'unit_exam' ? '🏁' : (s.state === 'done' ? '✓' : s.i + 1);
    if (s.state === 'done')    return `<div class="${base} bg-emerald-600 text-white">${face}</div>`;
    if (s.state === 'current') return `<div class="${base} bg-indigo-500 text-white ring-4 ring-indigo-500/25">${face}</div>`;
    return `<div class="${base} bg-slate-700 text-slate-500">${face}</div>`;
  };
  const cells = rm.steps.map((s,i) => {
    const line = i < rm.steps.length - 1
      ? `<div class="flex-1 h-0.5 ${rm.steps[i+1].state === 'locked' ? 'bg-slate-700' : 'bg-emerald-600'}"></div>`
      : '';
    return dot(s) + line;
  }).join('');
  const caption = rm.phase === 'unit'
    ? `${rm.curIdx + 1}-qadam: ${esc(rm.current ? rm.current.title : '')}`
    : rm.phase === 'unit_exam' ? 'Unit imtihoni — oxirgi qadam'
    : rm.phase === 'remedial'  ? 'Takror vazifalar — imtihonga qaytamiz'
    : 'Daraja imtihoni';
  return `
  <div class="mt-3 pt-3 border-t border-slate-700">
    <div class="flex items-center mb-1.5">${cells}</div>
    <div class="text-[11px] text-slate-500">${caption}</div>
  </div>`;
}

// "Bundan keyin bu" bloki — vazifa boshlashdan oldin ketma-ketlikni ko'rsatadi.
function nextStepCard(rm) {
  if (!rm) return '';
  const row = (lab, val, cls, mark) => `
    <div class="flex items-baseline justify-between gap-3">
      <span class="text-slate-500 text-xs shrink-0">${lab}</span>
      <span class="${cls} text-sm text-right">${esc(val)} ${mark}</span>
    </div>`;
  return `
  <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 mb-4 space-y-2">
    ${row('Bajarilgan', rm.prev.title, 'text-emerald-400', rm.prev.title === '—' ? '' : '✓')}
    ${row('Hozir',      rm.current ? rm.current.title : '—', 'text-indigo-300 font-semibold', '←')}
    ${row('Keyin',      rm.next.title, 'text-slate-400', '🔒')}
  </div>`;
}

// kind: 'pass' | 'fail' | 'skip'
function resultCard(text, passed, kind) {
  const k = kind || (passed ? 'pass' : 'fail');
  const style = {
    pass: ['bg-emerald-950 border-emerald-600', 'text-emerald-400', '✅ Vazifa qabul qilindi!'],
    fail: ['bg-red-950 border-red-600', 'text-red-400', '❌ Hali yetarli emas'],
    skip: ['bg-slate-800 border-amber-600', 'text-amber-400', "📘 To'g'ri javoblar — o'qib chiqing"],
  }[k];
  const { html } = renderAI(text);
  return `<div class="${style[0]} border rounded-2xl p-4 mb-4">
    <div class="font-bold mb-2 ${style[1]}">${style[2]}</div>
    <div class="text-sm space-y-1">${html}</div>
  </div>`;
}

function renderProgram() {
  const p = user.program;
  if (!p) return renderDashboard();

  const type = getTaskType();
  const gate = canStartTask();
  const cur  = p.current;
  const lbl  = type ? taskLabel(type) : null;
  let body = '', bind = null;

  if (!type) {
    // Daraja uchun syllabus hali yozilmagan
    body = `<div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 text-center">
      <div class="text-5xl mb-3">🚧</div>
      <div class="font-bold mb-1">${p.level} dasturi tayyorlanmoqda</div>
      <div class="text-slate-400 text-sm mb-4">Siz ${LEVELS[Math.max(0,LEVELS.indexOf(p.level)-1)]} darajasini tugatdingiz — tabriklaymiz! Yangi daraja tez orada qo'shiladi.</div>
      <button id="pg-free" class="bg-indigo-600 hover:bg-indigo-500 rounded-xl px-6 py-2.5 text-sm font-semibold transition-colors">Erkin mashqlarga o'tish</button>
    </div>`;
    bind = () => { document.getElementById('pg-free').onclick = renderDashboard; };

  } else if (lessonOpen || needsLesson()) {
    // Vazifadan OLDIN mavzu darsi: so'zlar + grammatika. AI chaqirilmaydi.
    body = unitLessonBox(getUnit());
    bind = bindLessonBox;

  } else if (cur && cur.status === 'failed') {
    const relief = cur.relief;
    body = `${cur.feedback ? resultCard(cur.feedback, false) : ''}
    <div class="bg-slate-800 rounded-2xl p-4 border border-amber-600 mb-4">
      <div class="text-sm text-amber-400 font-semibold mb-1">${cur.attempts}-urinish tugadi</div>
      <div class="text-xs text-slate-400">${relief
        ? "Bu vazifa qiyin bo'ldi. Mavzuni qaytadan tushuntirib, yengilroq variant beraman."
        : "Yuqoridagi xatolarni o'qing va qayta urinib ko'ring. Keyingi vazifa bu bajarilmaguncha ochilmaydi."}</div>
    </div>
    <button id="pg-retry" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold transition-colors">
      ${relief ? '💡 Yengillashtirilgan variantni olish' : '🔁 Qayta urinish'}
    </button>
    ${cur.canSkip ? `
    <button id="pg-skip" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 rounded-xl py-3 text-sm transition-colors">
      ⏭ To'g'ri javoblarni ko'rib, keyingisiga o'tish
    </button>
    <div class="text-xs text-slate-500 mt-2 text-center">Bu vazifa "o'zlashtirilmagan" deb belgilanadi va unit imtihonida qaytariladi. XP berilmaydi.</div>` : ''}`;
    bind = () => {
      document.getElementById('pg-retry').onclick = doRetryTask;
      const sk = document.getElementById('pg-skip');
      if (sk) sk.onclick = doSkipTask;
    };

  } else if (cur && cur.status === 'submitted') {
    body = `<div class="bg-slate-800 rounded-2xl p-4 border border-amber-600 mb-4">
      <div class="font-semibold text-sm text-amber-400 mb-1">Tekshiruv tugallanmadi</div>
      <div class="text-xs text-slate-400">Aloqa uzilgan yoki javob to'liq kelmadi. Urinish sanalmadi — javobingizni qayta yuboring.</div>
    </div>
    ${taskBox(cur, lbl)}`;
    bind = bindTaskBox;

  } else if (cur) {
    body = taskBox(cur, lbl);
    bind = bindTaskBox;

  } else if (gate.reason === 'daily_limit') {
    body = `<div class="bg-slate-800 rounded-2xl p-6 border border-emerald-700 text-center">
      <div class="text-5xl mb-3">🎉</div>
      <div class="font-bold mb-1">Bugungi norma bajarildi!</div>
      <div class="text-slate-400 text-sm">${MAX_DAILY_TASKS}/${MAX_DAILY_TASKS} vazifa. Yodlash uchun tanaffus kerak — ertaga davom etamiz.</div>
      <div class="text-xs text-slate-500 mt-3">Xohlasangiz erkin mashqlar bilan shug'ullaning 👇</div>
      <button id="pg-free" class="mt-3 bg-slate-700 hover:bg-slate-600 rounded-xl px-6 py-2.5 text-sm transition-colors">Erkin mashqlar</button>
    </div>`;
    bind = () => { document.getElementById('pg-free').onclick = renderDashboard; };

  } else if (isOffline()) {
    // Vazifa berish AI'ga bog'liq — internetsiz mumkin emas. Lekin dars va
    // takrorlash to'liq lokal, shuning uchun bo'sh ekran o'rniga shularni taklif qilamiz.
    const due = dueWords(user.vocabulary || []).length;
    body = `<div class="bg-slate-800 rounded-2xl p-6 border border-amber-600 text-center">
      <div class="text-5xl mb-3">📡</div>
      <div class="font-bold mb-1">Internet aloqasi yo'q</div>
      <div class="text-slate-400 text-sm mb-4">Yangi vazifa olish uchun internet kerak. Ammo quyidagilar internetsiz ham ishlaydi:</div>
      <button id="off-lesson" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 text-sm font-semibold transition-colors mb-2">📖 Mavzu darsi va so'zlar</button>
      <button id="off-review" class="w-full bg-slate-700 hover:bg-slate-600 rounded-xl py-3 text-sm transition-colors">
        📚 So'zlarni takrorlash${due ? ` (${due} ta navbatda)` : ''}
      </button>
    </div>`;
    bind = () => {
      document.getElementById('off-lesson').onclick = () => { lessonOpen = true; renderProgram(); };
      document.getElementById('off-review').onclick = () => {
        const v = user.vocabulary || [];
        if (!v.length) return toast("Lug'at bo'sh — avval mavzu darsini oching", 'error');
        const d = dueWords(v);
        startReview(d.length ? d : v);
      };
    };

  } else {
    // Vazifa tugagandan keyin ham shu shox ishlaydi — shuning uchun tugma matni
    // programFeedback bo'yicha o'zgaradi: "Boshlash" emas, "Keyingi vazifa".
    const cont = !!programFeedback;
    body = `${nextStepCard(getRoadmap())}
    <div class="bg-slate-800 rounded-2xl p-6 border border-indigo-600 text-center">
      <div class="text-5xl mb-3">${lbl.emoji}</div>
      <div class="font-bold mb-1">${lbl.title}</div>
      <div class="text-slate-400 text-sm mb-1">${lbl.desc}</div>
      <div class="text-xs text-slate-500 mb-4">Bugun: ${p.doneToday.count}/${MAX_DAILY_TASKS} vazifa</div>
      <button id="pg-start" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold transition-colors">${cont ? 'Keyingi vazifa →' : 'Boshlash →'}</button>
    </div>`;
    bind = () => { document.getElementById('pg-start').onclick = doStartTask; };
  }

  document.getElementById('app').innerHTML = `
  <div class="min-h-screen view-fade pb-24">
    <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
      <div class="font-semibold">Bugungi vazifa ✍️</div>
      <span class="text-amber-400 text-sm font-medium">🔥 ${user.streak||0}</span>
    </div>
    <div class="max-w-2xl mx-auto px-4 py-5">
      ${programFeedback ? resultCard(programFeedback, programFeedbackKind === 'pass', programFeedbackKind) : ''}
      ${programHeader()}
      <div id="pg-body">${body}</div>
    </div>
  </div>
  ${renderBottomNav('tasks')}`;

  programFeedback = null;   // faqat bir marta ko'rsatiladi
  programFeedbackKind = 'pass';
  bind?.();
  const les = document.getElementById('pg-lesson');
  if (les) les.onclick = () => { lessonOpen = true; renderProgram(); };
  bindAudioButtons(document.getElementById('app'));
  bindBottomNav();
}

// ── Mavzu darsi ekrani ───────────────────────────────────────────
function unitLessonBox(u) {
  if (!u) return '';
  const words = unitWords(u);
  const rows = words.map(w => `
    <div class="flex items-center gap-2 py-1.5 border-b border-slate-700/60 last:border-0">
      <button class="aud-btn text-slate-400 hover:text-indigo-400 shrink-0" data-audio="${esc(w.en)}">🔊</button>
      <div class="w-28 shrink-0">
        <div class="text-sm font-medium">${esc(w.en)}</div>
        <div class="text-[11px] text-slate-500">${esc(w.ipa)}</div>
      </div>
      <div class="text-sm text-slate-300 flex-1">${esc(w.uz)}</div>
    </div>`).join('');

  const seen = (user.program.lessonsSeen || []).includes(u.id);
  return `
  <div class="bg-slate-800 rounded-2xl p-5 border border-indigo-600 mb-4">
    <div class="text-xs text-indigo-400 font-semibold mb-1">📖 Mavzu darsi</div>
    <div class="font-bold mb-3">${esc(u.title)}</div>
    <div class="bg-slate-900 rounded-xl p-3 mb-4">
      <div class="text-xs text-slate-400 mb-1">📐 ${esc(u.grammar)}</div>
      <div class="text-sm whitespace-pre-line">${esc(u.explain || '')}</div>
    </div>
    <div class="text-xs text-slate-400 mb-1">📚 Unit so'zlari (${words.length} ta)</div>
    <div class="bg-slate-900 rounded-xl px-3 py-1 max-h-80 overflow-y-auto">${rows}</div>
  </div>
  <button id="pg-lesson-done" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold transition-colors">
    ${seen ? 'Yopish' : "Tushundim, vazifani boshlash →"}
  </button>`;
}

function bindLessonBox() {
  const btn = document.getElementById('pg-lesson-done');
  if (!btn) return;
  btn.onclick = () => {
    const u = getUnit();
    if (u && markLessonSeen(u.id)) {
      const n = seedUnitWords(u);
      saveUser();
      if (n) toast(`📚 ${n} ta so'z lug'atga qo'shildi`, 'success');
    }
    lessonOpen = false;
    renderProgram();
  };
}

function taskBox(cur, lbl) {
  const { html } = renderAI(cur.prompt);
  const head = `
  <div class="bg-slate-800 rounded-2xl p-4 border border-indigo-600 mb-4">
    <div class="text-xs text-indigo-400 font-semibold mb-2">${lbl.emoji} ${lbl.title}${cur.attempts?` · ${cur.attempts+1}-urinish`:''}</div>
    <div class="text-sm space-y-1">${html}</div>
  </div>`;

  // Gapirish vazifasi — javob matn emas, ovoz orqali beriladi.
  if (TASK_GUIDE[cur.type]?.audio) return `${head}
  <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 text-center mb-3">
    <div class="text-slate-400 text-sm mb-4">Beshta jumlani ketma-ket, ovoz chiqarib ayting.<br>Tugatgach yozishni to'xtating.</div>
    <button id="pg-mic" class="bg-slate-700 hover:bg-slate-600 rounded-full w-16 h-16 text-2xl transition-colors">🎤</button>
    <div id="pg-rec" class="hidden text-xs text-red-400 mt-3">Yozilmoqda… <span id="pg-rec-t">0</span>s — to'xtatish uchun ⏹ ni bosing</div>
    <div class="text-xs text-slate-500 mt-3">O'tish uchun ${Math.round(PASS_THRESHOLD*100)}% kerak</div>
  </div>`;

  return `${head}
  <textarea id="pg-ans" rows="6" placeholder="Javobingizni shu yerga yozing..."
    class="w-full bg-slate-800 rounded-xl px-4 py-3 text-sm border border-slate-700 focus:border-indigo-500 focus:outline-none mb-1"></textarea>
  <div class="flex justify-between items-center mb-3">
    <span id="pg-cnt" class="text-xs text-slate-500">0 so'z</span>
    <span class="text-xs text-slate-500">O'tish uchun ${Math.round(PASS_THRESHOLD*100)}% kerak</span>
  </div>
  <button id="pg-send" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 rounded-xl py-3 font-semibold transition-colors">Tekshirishga yuborish</button>`;
}

function bindTaskBox() {
  const mic = document.getElementById('pg-mic');
  if (mic) { mic.onclick = () => toggleRec('program'); return; }
  const ta = document.getElementById('pg-ans');
  ta.addEventListener('input', () => {
    const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    document.getElementById('pg-cnt').textContent = `${w} so'z`;
  });
  document.getElementById('pg-send').onclick = doSubmitTask;
  ta.focus();
}

function programLoading(msg) {
  document.getElementById('pg-body').innerHTML = `
  <div class="bg-slate-800 rounded-2xl p-8 border border-slate-700 text-center">
    <div class="dot-load text-indigo-400 text-2xl mb-2"><span>●</span><span>●</span><span>●</span></div>
    <div class="text-slate-400 text-sm">${msg}</div>
  </div>`;
}

async function doStartTask() {
  if (programBusy) return;
  programBusy = true;
  programLoading('Vazifa tayyorlanmoqda...');
  const r = await startTask();
  programBusy = false;
  if (!r.ok) {
    toast(r.message || 'Vazifa olinmadi. Qayta urinib ko\'ring.', 'error');
    return renderProgram();
  }
  renderProgram();
}

async function doRetryTask() {
  if (programBusy) return;
  programBusy = true;
  programLoading(user.program.current?.relief ? 'Mavzu qayta tushuntirilmoqda...' : 'Tayyorlanmoqda...');
  const r = await retryTask();
  programBusy = false;
  if (!r.ok) toast(r.message || 'Xatolik. Qayta urinib ko\'ring.', 'error');
  renderProgram();
}

async function doSkipTask() {
  if (programBusy) return;
  programBusy = true;
  programLoading("To'g'ri javoblar tayyorlanmoqda...");
  const r = await revealAndSkip();
  programBusy = false;
  if (!r.ok) {
    toast('Xatolik. Qayta urinib ko\'ring.', 'error');
    return renderProgram();
  }
  if (r.text) { programFeedback = r.text; programFeedbackKind = 'skip'; }
  else toast("Javoblarni ololmadim, lekin keyingi vazifaga o'tdingiz", 'info');
  renderProgram();
}

// Gapirish vazifasi: ovoz yozib bo'lingach chaqiriladi.
async function doSubmitSpeak(blob) {
  if (programBusy) return;
  programBusy = true;
  programLoading('Ovozingiz tinglanmoqda...');
  let audio = null;
  try {
    audio = { data: await blobToB64(blob), mimeType: blob.type || 'audio/webm' };
  } catch (_e) {
    programBusy = false;
    toast('Ovozni yuborishda xatolik', 'error');
    return renderProgram();
  }
  await finishSubmit(await submitTask(null, audio));
}

async function doSubmitTask() {
  if (programBusy) return;
  const ta = document.getElementById('pg-ans');
  const answer = ta.value.trim();
  if (!answer) { toast('Javob bo\'sh', 'error'); return; }

  programBusy = true;
  document.getElementById('pg-send').disabled = true;
  programLoading('Javobingiz tekshirilmoqda...');
  await finishSubmit(await submitTask(answer));
}

// submitTask natijasini UI'ga qo'llash — matn va ovoz yo'llari uchun umumiy.
async function finishSubmit(r) {
  programBusy = false;

  if (!r.ok) {
    if (r.reason === 'no_audio') toast("Ovoz eshitilmadi — mikrofonni tekshirib, qaytadan ayting", 'error');
    else if (r.reason === 'no_marker') toast("Tekshiruv tugallanmadi — qayta yuboring", 'error');
    else toast(r.message || 'Xatolik', 'error');
    return renderProgram();
  }

  if (r.passed) {
    programFeedback = r.text;
    toast(`✅ ${r.score.correct}/${r.score.total} — vazifa qabul qilindi! +${XP_PER_TASK} XP`, 'success');
    const moved = calibrate();
    if (moved) showCalibrationModal(moved);
  } else {
    toast(`${r.score.correct}/${r.score.total} — hali yetarli emas`, 'error');
    calibrate();
  }
  renderProgram();
}

function showCalibrationModal(moved) {
  const p = user.program;
  const up = moved === 'up';
  document.getElementById('calib-modal')?.remove();
  const m = document.createElement('div');
  m.id = 'calib-modal';
  m.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4';
  m.innerHTML = `
    <div class="bg-slate-800 rounded-2xl p-6 max-w-sm w-full border ${up?'border-emerald-600':'border-amber-600'} shadow-2xl text-center">
      <div class="text-5xl mb-3">${up?'🚀':'🎯'}</div>
      <h2 class="font-bold mb-2">${up?'Darajangiz oshirildi!':'Darajangiz moslashtirildi'}</h2>
      <p class="text-slate-400 text-sm mb-4">${up
        ? `Dastlabki 3 vazifani xatosiz bajardingiz — bu daraja siz uchun oson. <b>${p.level}</b> dasturidan davom etamiz.`

// IELTS imtihon timeri (chat headerdagi ⏱)
function stopExamTimer() {
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  const d = document.getElementById('ch-timer-d');
  if (d) { d.classList.add('hidden'); d.textContent = ''; }
  document.getElementById('ch-timer')?.classList.remove('bg-red-700');
}

function startExamTimer(mins) {
  stopExamTimer();
  let left = mins * 60;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const d = document.getElementById('ch-timer-d');
  if (d) { d.classList.remove('hidden'); d.textContent = fmt(left); }
  document.getElementById('ch-timer')?.classList.add('bg-red-700');
  examTimer = setInterval(() => {
    left--;
    const dd = document.getElementById('ch-timer-d');
    if (!dd) { stopExamTimer(); return; }
    dd.textContent = fmt(left);
    if (left <= 0) {
      stopExamTimer();
      toast('⏱ Vaqt tugadi!', 'error');
      appendMsg('ai', `⏱ **Vaqt tugadi!** (${mins} daqiqa) Real imtihonda shu yerda to'xtatilasiz — javobingizni hozir yuboring.`);
    }
  }, 1000);
}

let mediaRec = null, recChunks = [], recStream = null, recTimer = null, recSecs = 0, recStartTime = 0;
const REC_MAX_SECS = 150; // IELTS Speaking Part 2: 2 daqiqa monolog + zaxira

function blobToB64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Yozgich ikki joyda ishlaydi: chat ('ch-*' idlar) va dastur ('pg-*' idlar).
let recTarget = 'chat';
const REC_IDS = { chat: { bar:'ch-rec', mic:'ch-mic', secs:'ch-rec-t' },
                  program: { bar:'pg-rec', mic:'pg-mic', secs:'pg-rec-t' } };

function setRecUI(on) {
  const ids = REC_IDS[recTarget] || REC_IDS.chat;
  const bar = document.getElementById(ids.bar);
  const mic = document.getElementById(ids.mic);
  if (bar) bar.classList.toggle('hidden', !on);
  if (mic) {
    mic.classList.toggle('bg-red-600', on);
    mic.classList.toggle('bg-slate-700', !on);
    mic.textContent = on ? '⏹' : '🎤';
  }
}

async function toggleRec(target) {
  if (target) recTarget = target;
  const busy = recTarget === 'program' ? programBusy : chatBusy;
  if (busy && !(mediaRec && mediaRec.state === 'recording')) return;
  if (mediaRec && mediaRec.state === 'recording') { stopRec(); return; }
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    return toast("Brauzeringiz ovoz yozishni qo'llamaydi", 'error');
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_e) {
    return toast('Mikrofonga ruxsat bering', 'error');
  }
  const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg']
    .find(t => MediaRecorder.isTypeSupported?.(t)) || '';
  mediaRec = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
  recChunks = [];
  mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec.start();
  if (recTarget === 'program') programBusy = true; else chatBusy = true;
  recStartTime = Date.now();
  recSecs = 0;
  setRecUI(true);
  const secsId = (REC_IDS[recTarget] || REC_IDS.chat).secs;
  recTimer = setInterval(() => {
    recSecs++;
    const t = document.getElementById(secsId);
    if (t) t.textContent = recSecs;
    if (recSecs >= REC_MAX_SECS) stopRec();
  }, 1000);
}

function stopRec() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
  setRecUI(false);
}

async function onRecStop() {
  recStream?.getTracks().forEach(t => t.stop());
  recStream = null;
  const type = mediaRec?.mimeType || 'audio/webm';
  const blob = new Blob(recChunks, { type });
  recChunks = [];
  const short = Date.now() - recStartTime < 1000;
  if (!blob.size || short) {
    if (recTarget === 'program') programBusy = false; else chatBusy = false;
    if (short) toast('Juda qisqa — biroz uzunroq gapiring', 'error');
    if (recTarget === 'program') renderProgram();
    return;
  }
  if (recTarget === 'program') { programBusy = false; await doSubmitSpeak(blob); return; }
  await sendAudio(blob);
}

async function sendAudio(blob) {
  const sendBtn = document.getElementById('ch-send');
  if (!sendBtn) return;
  const micBtn = document.getElementById('ch-mic');
  const url = URL.createObjectURL(blob);
  appendAudioMsg('user', url);
  chatBusy = true;
  sendBtn.disabled = true;
  micBtn.disabled = true;
  showLoader();
  let resp;
  try {
    const data = await blobToB64(blob);
    resp = await callAI('🎤 [Ovozli xabar]', { audio: { data, mimeType: blob.type || 'audio/webm' } });
  } catch (_e) {
    resp = '❌ Ovozni yuborishda xatolik.';
  }
  document.getElementById('ld')?.remove();
  chatBusy = false;
  sendBtn.disabled = false;
  micBtn.disabled = false;
  if (resp) {
    const isErr = (resp.startsWith('❌')||resp.startsWith('📡')||resp.startsWith('⏳')) && !resp.includes('Xato:');
    appendMsg('ai', resp, isErr);
  }
}

function teardownRec() {
  stopExamTimer();
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  recStream?.getTracks().forEach(t => t.stop());
  recStream = null;
  if (mediaRec && mediaRec.state === 'recording') {
    mediaRec.onstop = null;
    mediaRec.stop();
  }
  mediaRec = null;
  recChunks = [];
  setRecUI(false);
}

function appendMsg(role, text, isApiErr=false) {
  const box = document.getElementById('ch-msgs');

    wrap.innerHTML = `<div class="max-w-xs sm:max-w-md bg-indigo-600 rounded-tl-2xl rounded-b-2xl px-4 py-2.5 text-sm">${esc(text)}</div>`;
  } else {
    const { html, hasAudio, firstScript } = renderAI(text);
    wrap.innerHTML = `
      <div class="max-w-xs sm:max-w-md bg-slate-700 rounded-tr-2xl rounded-b-2xl px-4 py-2.5 text-sm ${isApiErr?'border border-red-600':''}">
        <div class="text-xs text-slate-400 mb-1">🤖 EnglishBot</div>
        ${html}
      </div>`;
    wrap._audio = { hasAudio, firstScript };
  }
  box.appendChild(wrap);
  bindAudioButtons(wrap);
  if (wrap._audio?.hasAudio) speakText(wrap._audio.firstScript);
  box.scrollTop = box.scrollHeight;
}

function appendAudioMsg(role, audioUrl) {
  const box = document.getElementById('ch-msgs');
  if (!box) return;
  const wrap = document.createElement('div');
  wrap.className = `msg-in flex ${role==='user'?'justify-end':'justify-start'}`;
  wrap.innerHTML = `<div class="max-w-xs sm:max-w-md bg-indigo-600 rounded-tl-2xl rounded-b-2xl px-3 py-2 text-sm">
      <div class="text-xs text-indigo-200 mb-1">🎤 Ovozli xabar</div>
      <audio controls src="${esc(audioUrl)}" class="w-full h-9"></audio>
    </div>`;
  box.appendChild(wrap);
  const aud = wrap.querySelector('audio');
  if (aud) aud.oncanplay = () => URL.revokeObjectURL(audioUrl);
  box.scrollTop = box.scrollHeight;
}

function showLoader() {
  const box = document.getElementById('ch-msgs');
  if (!box) return;
  const d = document.createElement('div');
  d.id = 'ld'; d.className = 'flex justify-start';
  d.innerHTML = `<div class="bg-slate-700 rounded-tr-2xl rounded-b-2xl px-4 py-3 text-sm">
    <div class="text-xs text-slate-400 mb-1">🤖 EnglishBot</div>
    <div class="dot-load text-slate-400 text-lg"><span>●</span><span>●</span><span>●</span></div>
  </div>`;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}

async function doSend() {
  if (chatBusy) return;
  const inp = document.getElementById('ch-in');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('ch-cnt').textContent = "0 so'z";
  appendMsg('user', txt);
  chatBusy = true;
  document.getElementById('ch-send').disabled = true;
  showLoader();
  const resp = await callAI(txt);
  document.getElementById('ld')?.remove();
  chatBusy = false;
  document.getElementById('ch-send').disabled = false;
  if (resp) {
    const isErr = (resp.startsWith('❌')||resp.startsWith('📡')||resp.startsWith('⏳')) && !resp.includes('Xato:');
    appendMsg('ai', resp, isErr);
  }
  inp.focus();
}

// ─── 13. VIEW: VOCABULARY ────────────────────────────────────────
// Spaced repetition: mastery darajasiga qarab keyingi takrorlash oralig'i (kun)
const SRS_DAYS = [1, 1, 2, 4, 7, 14];
function dueWords(list) {
  const now = Date.now();
  return list.filter(v => !v.nextReview || new Date(v.nextReview).getTime() <= now);
}

function stars(n) {
  return `<span class="text-amber-400">${'★'.repeat(n)}</span><span class="text-slate-500">${'☆'.repeat(5-n)}</span>`;
}

function vocabRows(list, hasQuery=false) {
  if (!list.length) return hasQuery
    ? '<div class="text-slate-500 text-sm text-center py-6">Natija topilmadi</div>'
    : '';
  return list.map(v=>`
    <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 flex items-center justify-between">
      <div>
        <div class="font-medium text-sm">${esc(v.word)}${v.pronunciation?` <span class="text-slate-500 font-normal">(${esc(v.pronunciation)})</span>`:''}</div>
        <div class="text-slate-400 text-xs mt-0.5">${esc(v.translation)}</div>
      </div>
      <div class="flex items-center gap-2">
        <button class="vb-say text-lg leading-none" title="Talaffuzni eshitish" data-w="${esc(v.word)}">🔊</button>
        <div class="text-sm">${stars(v.mastery)}</div>
      </div>
    </div>`).join('');
}

function renderVocabulary() {
  const vocab = user.vocabulary||[];
  const due = dueWords(vocab);
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen view-fade pb-24">
    <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center gap-3 sticky top-0 z-10">
      <button id="vb-back" class="text-slate-400 hover:text-white text-xl w-8 h-8 flex items-center justify-center">←</button>
      <div class="flex-1 font-semibold">So'zlar lug'ati 📚</div>
      <span class="text-slate-400 text-sm">${vocab.length} ta</span>
    </div>
    <div class="max-w-2xl mx-auto px-4 py-5">
      <input id="vb-q" type="text" placeholder="Qidirish..."
        class="w-full bg-slate-800 rounded-xl px-4 py-3 text-sm border border-slate-700 focus:border-indigo-500 focus:outline-none mb-3"/>
      ${vocab.length?`<button id="vb-rev" class="w-full ${due.length?'bg-indigo-600 hover:bg-indigo-500':'bg-slate-700 hover:bg-slate-600'} rounded-xl py-3 font-semibold text-sm mb-4 transition-colors">
        ${due.length?`Takrorlash ▶ (${due.length} ta navbatda)`:`Hammasi takrorlangan ✅ — baribir mashq qilish (${vocab.length})`}</button>`:''}
      <div id="vb-list" class="space-y-2">${vocabRows(vocab)}</div>
      ${!vocab.length?`<div class="text-center py-10">
        <div class="text-4xl mb-3">📖</div>
        <div class="text-slate-400 text-sm">Mavzu darsini ochsangiz<br>unit so'zlari shu yerga tushadi</div>
      </div>`:''}
    </div>
  </div>
  ${renderBottomNav('progress')}`;

  document.getElementById('vb-back').onclick = renderProgress;
  bindBottomNav();
  document.getElementById('vb-q')?.addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    const filtered = q ? vocab.filter(v=>v.word.toLowerCase().includes(q)||v.translation.toLowerCase().includes(q)) : vocab;
    document.getElementById('vb-list').innerHTML = vocabRows(filtered, !!q);
  });
  document.getElementById('vb-rev')?.addEventListener('click', ()=>startReview(due.length?due:vocab));
  // 🔊 tugmalar (delegation — qidiruvda re-render bo'lsa ham ishlaydi)
  document.getElementById('vb-list').addEventListener('click', e=>{
    const b = e.target.closest('.vb-say');
    if (b) speakText(b.dataset.w);
  });
}

// ─── 14. REVIEW MODE ─────────────────────────────────────────────
function startReview(vocab) {
  const queue = [...vocab].sort((a,b)=>a.mastery-b.mastery);
  let idx = 0;

  function showCard() {
    if (idx >= queue.length) {
      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-4 view-fade">
          <div class="text-center">
            <div class="text-5xl mb-4">🎉</div>
            <h2 class="text-xl font-bold mb-2">Takrorlash tugadi!</h2>
            <p class="text-slate-400 mb-6">${queue.length} ta so'z takrorlandi</p>
            <button id="rv-done" class="bg-indigo-600 hover:bg-indigo-500 rounded-xl px-8 py-3 font-semibold transition-colors">Lug'atga qaytish</button>
          </div>
        </div>`;
      document.getElementById('rv-done').onclick = renderVocabulary;
      return;
    }

    const item = queue[idx];
    document.getElementById('app').innerHTML = `
      <div class="min-h-screen flex flex-col view-fade">
        <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center gap-3">
          <button id="rv-exit" class="text-slate-400 hover:text-white text-xl w-8 h-8 flex items-center justify-center">←</button>
          <div class="flex-1 font-semibold">Takrorlash</div>
          <span class="text-slate-400 text-sm">${idx+1}/${queue.length}</span>
        </div>
        <div class="flex-1 flex items-center justify-center p-6">
          <div class="w-full max-w-sm">
            <div class="bg-slate-800 rounded-2xl p-8 border border-slate-700 text-center mb-4">
              <div class="text-3xl font-bold mb-1">${esc(item.word)} <button id="rv-say" title="Eshitish" class="text-xl align-middle">🔊</button></div>
              ${item.pronunciation?`<div class="text-slate-400 text-sm mb-1">(${esc(item.pronunciation)})</div>`:''}
              <div class="text-slate-500 text-sm">O'zbek tarjimasini kiriting</div>
            </div>
            <input id="rv-in" type="text" placeholder="Tarjima..."
              class="w-full bg-slate-700 rounded-xl px-4 py-3 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none mb-3 text-center"/>
            <button id="rv-chk" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold text-sm transition-colors">Tekshirish</button>
          </div>
        </div>
      </div>`;

    document.getElementById('rv-exit').onclick = renderVocabulary;
    document.getElementById('rv-say').onclick = () => speakText(item.word);
    const inp = document.getElementById('rv-in');
    inp.focus();

    const check = () => {
      const ans = inp.value.trim().toLowerCase();
      const cor = item.translation.toLowerCase();
      const firstToken = cor.split(' ')[0];
      const ok = ans === cor
        || (ans.length >= 2 && cor.includes(ans))
        || (firstToken.length >= 3 && ans.includes(firstToken));

      const vItem = user.vocabulary.find(v=>v.word===item.word);
      if (vItem) {
        vItem.mastery = ok ? Math.min(5,vItem.mastery+1) : Math.max(0,vItem.mastery-1);
        // Spaced repetition: keyingi takrorlash sanasi mastery'ga bog'liq
        vItem.nextReview = new Date(Date.now() + SRS_DAYS[vItem.mastery]*86400000).toISOString();
        saveUser();
      }
      if (ok) addXP(2);

      document.getElementById('app').innerHTML = `
        <div class="min-h-screen flex flex-col view-fade">
          <div class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center">
            <div class="flex-1 font-semibold">Takrorlash</div>
            <span class="text-slate-400 text-sm">${idx+1}/${queue.length}</span>
          </div>
          <div class="flex-1 flex items-center justify-center p-6">
            <div class="w-full max-w-sm">
              <div class="${ok?'bg-emerald-950 border-emerald-500':'bg-red-950 border-red-500'} border rounded-2xl p-6 text-center mb-4">
                <div class="text-3xl mb-2">${ok?'✅':'❌'}</div>
                <div class="${ok?'text-emerald-400':'text-red-400'} font-bold mb-1">${ok?"To'g'ri!":'Noto\'g\'ri'}</div>
                <div class="text-sm text-slate-300">${esc(item.word)} — ${esc(item.translation)}</div>
                ${!ok?`<div class="text-xs text-slate-400 mt-1">Sizning javob: ${esc(inp.value)}</div>`:''}
              </div>
              <button id="rv-nxt" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 font-semibold text-sm transition-colors">Keyingisi →</button>
            </div>
          </div>
        </div>`;
      document.getElementById('rv-nxt').onclick = ()=>{ idx++; showCard(); };
    };

    document.getElementById('rv-chk').onclick = check;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
  }

  showCard();
}

// ─── 15. APP INIT ─────────────────────────────────────────────────
function init() {
  user = loadUser();
  if (!user) { renderOnboarding(); return; }
  if (!user.ielts) user.ielts = { targetBand: 6.5, scores: [] };
  // Streak endi vazifaga bog'liq. Eski foydalanuvchi streak'ini yo'qotmasin —
  // oxirgi kirish kunini boshlang'ich nuqta qilib olamiz.
  if (!user.lastTaskDay) user.lastTaskDay = user.lastVisit || todayStr();
  registerVisit();

  // Dastur: eski foydalanuvchida yo'q — A1-01 dan boshlanadi va bir marta tushuntiriladi.
  const isMigrated = !user.program;
  if (isMigrated) {
    user.program = initProgram('A1');
    saveUser();
  }
  // Keyinroq qo'shilgan maydonlar — eski progressda yo'q, crash bo'lmasin.
  if (!Array.isArray(user.program.lessonsSeen)) user.program.lessonsSeen = [];
  if (!Array.isArray(user.program.weakUnits))   user.program.weakUnits = [];
  rollDaily();
  // Onboardingni tugatib, tushuntirish ekranini ko'rmasdan chiqib ketgan yangi foydalanuvchi.
  // Eski foydalanuvchida `introSeen` umuman yo'q (undefined) — ular bu shoxga tushmaydi.
  if (user.introSeen === false) { renderPathIntro(); syncFromServer(); return; }
  renderDashboard();
  if (isMigrated) showProgramIntro();

  // Server progressi yangiroq bo'lsa (boshqa qurilma yoki tozalangan brauzer) — uni olamiz.
  syncFromServer();
}

async function syncFromServer() {
  const remote = await loadProgress();
  if (!remote) return;
  const localAt  = user.program?.updatedAt || '';
  const remoteAt = remote.updatedAt || '';
  if (remoteAt <= localAt) return;
  user.program = { ...initProgram(remote.level), ...remote };
  LS.set('eb_user', user);   // saveUser emas — serverga qayta yozib yubormaslik uchun
  toast('Progress boshqa qurilmadan tiklandi', 'info');
  renderDashboard();
}

  const m = document.createElement('div');
  m.id = 'intro-modal';
  m.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4';
  m.innerHTML = `
    <div class="bg-slate-800 rounded-2xl p-6 max-w-sm w-full border border-indigo-600 shadow-2xl">
      <div class="text-center text-5xl mb-3">🎓</div>

        <p>Vazifa bajarilmaguncha keyingisi ochilmaydi — daraja endi XP bilan emas, <b>imtihondan o'tib</b> ko'tariladi.</p>
        <p class="text-slate-400 text-xs">Hammamiz A1-01 dan boshlaymiz. Agar bu siz uchun oson bo'lsa, dastlabki 3 vazifadan keyin daraja avtomatik oshiriladi. Yig'gan XP, so'zlar va streak saqlanib qoldi.</p>

// Aloqa tiklanganda dastur ekrani o'zi yangilanadi — foydalanuvchi qo'lda qayta yuklamasin.
window.addEventListener('online',  () => { toast('Aloqa tiklandi ✅', 'success'); if (user?.program) renderProgram(); });
window.addEventListener('offline', () => toast("Internet aloqasi uzildi — dars va takrorlash ishlaydi", 'info'));
