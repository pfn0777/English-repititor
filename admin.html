<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnglishBot — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="app" class="max-w-6xl mx-auto px-4 py-8"></div>

<script>
const SB_URL = 'https://wbcwavqbxjflgtxepdmf.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiY3dhdnFieGpmbGd0eGVwZG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NjAxMzEsImV4cCI6MjA5ODEzNjEzMX0.8RA7w_L6C3fy_ytaJl6ipETz2WZuamFhSGcIQGMOXXo';

// Credentials kept only in memory for the session — never persisted.
let auth = { username: '', password: '' };

// Qidiruv/filtr holati. Jadval qayta yuklanganda saqlanib qoladi.
let view = { q: '', ent: '' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = () => document.getElementById('app');

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  const bg = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-green-600' : 'bg-slate-700';
  t.className = `fixed top-4 left-1/2 -translate-x-1/2 ${bg} px-4 py-2 rounded-xl text-sm shadow-lg z-50`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

async function api(action, extra = {}) {
  const res = await fetch(`${SB_URL}/functions/v1/admin`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SB_ANON}`, 'apikey': SB_ANON },
    body: JSON.stringify({ action, username: auth.username, password: auth.password, ...extra }),
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// ─── LOGIN ──────────────────────────────────────────────
function renderLogin() {
  app().innerHTML = `
    <div class="max-w-sm mx-auto mt-16">
      <h1 class="text-xl font-bold mb-1 text-center">Admin panel 🔐</h1>
      <p class="text-slate-400 text-sm mb-6 text-center">EnglishBot boshqaruvi</p>
      <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Login</label>
          <input id="lg-user" type="text" autocomplete="username"
            class="w-full bg-slate-700 rounded-xl px-4 py-3 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Parol</label>
          <input id="lg-pass" type="password" autocomplete="current-password"
            class="w-full bg-slate-700 rounded-xl px-4 py-3 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        </div>
        <button id="lg-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 text-sm font-semibold transition-colors">Kirish</button>
      </div>
    </div>`;
  const submit = async () => {
    const username = document.getElementById('lg-user').value.trim();
    const password = document.getElementById('lg-pass').value;
    if (!username || !password) return toast("Login va parolni kiriting", 'error');
    const btn = document.getElementById('lg-btn');
    btn.disabled = true; btn.textContent = 'Tekshirilmoqda...';
    auth = { username, password };
    const { ok, data } = await api('login');
    if (!ok || !data.ok) {
      auth = { username: '', password: '' };
      btn.disabled = false; btn.textContent = 'Kirish';
      return toast(data.message || "Login yoki parol noto'g'ri", 'error');
    }
    renderPanel();
  };
  document.getElementById('lg-btn').onclick = submit;
  document.getElementById('lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

// ─── HELPERS ────────────────────────────────────────────
const GOAL_LABEL = { travel:'✈️ Sayohat', work:'💼 Ish', ielts:'📝 IELTS', daily:'💬 Kundalik', general:'🌟 Umumiy' };
const ENT_FILTERS = [['', 'Hammasi'], ['active', 'Active'], ['trial', 'Trial'], ['free', 'Free']];

function entBadge(u) {
  const base = 'inline-block px-2 py-0.5 rounded-lg text-xs whitespace-nowrap ';
  if (u.ent_state === 'active') return `<span class="${base}bg-green-500/15 text-green-300">✅ ${u.days_left} kun</span>`;
  if (u.ent_state === 'trial')  return `<span class="${base}bg-amber-500/15 text-amber-300">⏳ Trial ${u.days_left} kun</span>`;
  return `<span class="${base}bg-slate-600/40 text-slate-400">⚪ Free</span>`;
}

function tgCell(u) {
  if (u.tg_username) return `<span class="text-sky-300">@${esc(u.tg_username)}</span>`;
  if (u.tg_id) return `<span class="text-slate-400 text-xs">id:${esc(u.tg_id)}</span>`;
  return `<span class="text-slate-600">—</span>`;
}

function grantCell(u, defLimit) {
  // tg_id yo'q bo'lsa obuna hech narsa bermaydi — chat funksiyasi initData'siz
  // foydalanuvchini har doim 'free' deb hisoblaydi.
  const noTg = !u.tg_id;
  const dis = noTg ? 'disabled' : '';
  const cls = noTg
    ? 'bg-slate-700/50 text-slate-600 cursor-not-allowed'
    : 'bg-slate-600 hover:bg-green-600 text-slate-100';
  const title = noTg ? "Telegram ID yo'q — obuna ishlamaydi" : '';
  const btn = (d, label) => `<button data-uid="${esc(u.id)}" data-days="${d}" ${dis} title="${esc(title)}"
    class="gr-btn ${cls} rounded-lg px-1.5 py-1 text-xs transition-colors">${label}</button>`;
  return `
    <div class="flex items-center gap-1 whitespace-nowrap">
      ${btn(7, '+7')}${btn(30, '+30')}${btn(90, '+90')}
      <button data-uid="${esc(u.id)}" data-days="-1"
        class="gr-btn bg-slate-700 hover:bg-red-600 rounded-lg px-1.5 py-1 text-xs transition-colors" title="Obunani bekor qilish">✕</button>
    </div>`;
}

function userRow(u, defLimit) {
  return `
    <tr class="border-b border-slate-700/50" data-row="${esc(u.id)}">
      <td class="py-2 pr-3">${esc(u.name || '—')}</td>
      <td class="py-2 pr-3">${tgCell(u)}</td>
      <td class="py-2 pr-3 ent-cell" data-uid="${esc(u.id)}">${entBadge(u)}</td>
      <td class="py-2 pr-3 text-slate-400">${esc(u.level || '—')}</td>
      <td class="py-2 pr-3">${esc(GOAL_LABEL[u.goal] || u.goal || '—')}</td>
      <td class="py-2 pr-3 text-center text-indigo-300">${u.today_req ?? 0}</td>
      <td class="py-2 pr-3 text-center text-slate-400">${u.total_req ?? 0}</td>
      <td class="py-2 pr-3 text-slate-500 text-xs whitespace-nowrap">${u.last_seen ? new Date(u.last_seen).toLocaleDateString('uz') : '—'}</td>
      <td class="py-2 pr-3 whitespace-nowrap">
        <input type="number" min="0" value="${u.daily_limit ?? ''}" placeholder="${esc(defLimit)}" data-uid="${esc(u.id)}"
          class="lim-in w-14 bg-slate-700 rounded-lg px-2 py-1 text-xs border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        <button data-uid="${esc(u.id)}" class="lim-save bg-slate-600 hover:bg-indigo-600 rounded-lg px-2 py-1 text-xs transition-colors">✓</button>
      </td>
      <td class="py-2">${grantCell(u, defLimit)}</td>
    </tr>`;
}

function statCard(value, label, color) {
  return `
    <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 text-center">
      <div class="text-2xl font-bold ${color}">${value}</div>
      <div class="text-xs text-slate-400 mt-1">${label}</div>
    </div>`;
}

// ─── PANEL ──────────────────────────────────────────────
async function renderPanel() {
  app().innerHTML = `<div class="text-center text-slate-400 mt-16">Yuklanmoqda...</div>`;
  const { ok, status, data } = await api('stats', { q: view.q, ent: view.ent });
  if (!ok || !data.ok) {
    if (status === 401) { auth = { username: '', password: '' }; return renderLogin(); }
    app().innerHTML = `<div class="text-center text-red-400 mt-16">Xatolik: ${esc(data.message || 'qayta urinib ko\'ring')}</div>`;
    return;
  }
  const s = data.settings;

  app().innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-bold">Admin panel ⚙️</h1>
      <button id="ap-logout" class="bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-1.5 text-xs transition-colors">Chiqish</button>
    </div>

    <div id="ap-cards" class="grid grid-cols-3 md:grid-cols-6 gap-3 mb-2"></div>
    <p id="ap-pay" class="text-xs text-slate-500 mb-6"></p>

    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 mb-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <h2 class="font-semibold">Foydalanuvchilar <span id="ap-ucount" class="text-slate-500 text-sm"></span></h2>
        <div class="flex flex-wrap items-center gap-2">
          <input id="ap-q" type="text" value="${esc(view.q)}" placeholder="Ism, @username yoki tg_id"
            class="bg-slate-700 rounded-xl px-3 py-1.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none w-56"/>
          <div class="flex gap-1">
            ${ENT_FILTERS.map(([v, label]) => `<button data-ent="${v}" class="ent-btn rounded-lg px-2.5 py-1.5 text-xs transition-colors">${label}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-400 border-b border-slate-700">
            <th class="py-2 pr-3 font-medium">Ism</th>
            <th class="py-2 pr-3 font-medium">TG</th>
            <th class="py-2 pr-3 font-medium">Obuna</th>
            <th class="py-2 pr-3 font-medium">Daraja</th>
            <th class="py-2 pr-3 font-medium">Maqsad</th>
            <th class="py-2 pr-3 font-medium text-center">Bugun</th>
            <th class="py-2 pr-3 font-medium text-center">Jami</th>
            <th class="py-2 pr-3 font-medium">Oxirgi</th>
            <th class="py-2 pr-3 font-medium">Limit</th>
            <th class="py-2 font-medium">Obuna berish</th>
          </tr></thead>
          <tbody id="ap-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 mb-6">
      <h2 class="font-semibold mb-3">Sozlamalar</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Aktiv provayder</label>
          <select id="st-prov" class="w-full bg-slate-700 rounded-xl px-4 py-2.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none">
            <option value="gemini" ${s.active_provider==='gemini'?'selected':''}>Gemini</option>
            <option value="claude" ${s.active_provider==='claude'?'selected':''}>Claude</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Model</label>
          <div id="st-model-wrap"></div>
          <p id="st-model-hint" class="text-xs text-slate-500 mt-1">Yuklanmoqda...</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Kunlik limit (har foydalanuvchi)</label>
          <input id="st-limit" type="number" min="0" value="${esc(s.daily_limit)}"
            class="w-full bg-slate-700 rounded-xl px-4 py-2.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Gemini kalit <span class="text-slate-500">(joriy: ${s.gemini_set ? esc(s.gemini_key_masked) : 'yo\'q'})</span></label>
          <input id="st-gkey" type="password" placeholder="O'zgartirish uchun yangi kalit kiriting"
            class="w-full bg-slate-700 rounded-xl px-4 py-2.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Claude kalit <span class="text-slate-500">(joriy: ${s.claude_set ? esc(s.claude_key_masked) : 'yo\'q'})</span></label>
          <input id="st-ckey" type="password" placeholder="O'zgartirish uchun yangi kalit kiriting"
            class="w-full bg-slate-700 rounded-xl px-4 py-2.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none"/>
        </div>
        <button id="st-save" class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-xl py-3 text-sm font-semibold transition-colors">Saqlash</button>
      </div>
    </div>

    <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700">
      <h2 class="font-semibold mb-3">Rejimlar bo'yicha statistika</h2>
      <div id="ap-modes"></div>
    </div>`;

  fillData(data);

  document.getElementById('ap-logout').onclick = () => {
    auth = { username: '', password: '' };
    view = { q: '', ent: '' };
    renderLogin();
  };

  // Qidiruv: qobiq qayta chizilmaydi, faqat jadval yangilanadi — fokus va
  // kursor joyida qoladi.
  let timer = null;
  document.getElementById('ap-q').oninput = e => {
    view.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(refreshUsers, 300);
  };
  document.querySelectorAll('.ent-btn').forEach(b => {
    b.onclick = () => { view.ent = b.dataset.ent; paintFilters(); refreshUsers(); };
  });
  paintFilters();

  // Model field is filled from list_models so a retired model name can't be typed in by hand.
  const modelField = { models: null, warning: '' };
  const drawModelField = () => {
    const wrap = document.getElementById('st-model-wrap');
    const hint = document.getElementById('st-model-hint');
    const cls = 'w-full bg-slate-700 rounded-xl px-4 py-2.5 text-sm border border-slate-600 focus:border-indigo-500 focus:outline-none';
    const prov = document.getElementById('st-prov').value;
    const cur = wrap.dataset.value || s.model || '';
    const list = (modelField.models || {})[prov] || [];
    if (!list.length) {
      wrap.innerHTML = `<input id="st-model" type="text" value="${esc(cur)}" class="${cls}"/>`;
      hint.textContent = modelField.models ? (modelField.warning || "Ro'yxat bo'sh — model nomini qo'lda kiriting") : 'Modellar yuklanmoqda...';
      hint.className = 'text-xs text-amber-400 mt-1';
    } else {
      const known = list.includes(cur);
      const opts = (known ? [] : [`<option value="${esc(cur)}" selected>⚠ ${esc(cur)} — mavjud emas</option>`])
        .concat(list.map(m => `<option value="${esc(m)}" ${m === cur ? 'selected' : ''}>${esc(m)}</option>`)).join('');
      wrap.innerHTML = `<select id="st-model" class="${cls}">${opts}</select>`;
      hint.textContent = known ? `${list.length} ta model mavjud` : "Joriy model bu kalit uchun mavjud emas — ro'yxatdan boshqasini tanlang";
      hint.className = known ? 'text-xs text-slate-500 mt-1' : 'text-xs text-amber-400 mt-1';
    }
    document.getElementById('st-model').onchange = e => { wrap.dataset.value = e.target.value; };
  };
  document.getElementById('st-prov').onchange = drawModelField;
  drawModelField();
  api('list_models').then(({ ok, data }) => {
    modelField.models = (ok && data.ok) ? (data.models || {}) : {};
    modelField.warning = (ok && data.ok) ? (data.warning || '') : (data.message || "Modellar ro'yxati olinmadi");
    drawModelField();
  });

  document.getElementById('st-save').onclick = async () => {
    const settings = {
      active_provider: document.getElementById('st-prov').value,
      model: document.getElementById('st-model').value.trim(),
      daily_limit: document.getElementById('st-limit').value,
    };
    const gk = document.getElementById('st-gkey').value.trim();
    const ck = document.getElementById('st-ckey').value.trim();
    if (gk) settings.gemini_key = gk;
    if (ck) settings.claude_key = ck;
    const btn = document.getElementById('st-save');
    btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
    const { ok, data } = await api('save', { settings });
    btn.disabled = false; btn.textContent = 'Saqlash';
    if (!ok || !data.ok) return toast(data.message || 'Saqlanmadi', 'error');
    toast('Saqlandi', 'success');
    renderPanel();
  };
}

function paintFilters() {
  document.querySelectorAll('.ent-btn').forEach(b => {
    const on = b.dataset.ent === view.ent;
    b.className = `ent-btn rounded-lg px-2.5 py-1.5 text-xs transition-colors ${on ? 'bg-indigo-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`;
  });
}

// Qobiqqa tegmasdan jadval + kartochkalarni to'ldiradi.
function fillData(data) {
  const s = data.settings;
  document.getElementById('ap-cards').innerHTML = [
    statCard(data.userCount, 'Foydalanuvchi', 'text-indigo-400'),
    statCard(data.activeSubs, 'Faol obuna', 'text-green-400'),
    statCard(data.trialUsers, `Trial (${data.trialDays} kun)`, 'text-amber-400'),
    statCard(data.freeUsers, 'Free', 'text-slate-400'),
    statCard(`${data.todayReq}<span class="text-sm text-slate-500">/${data.globalLimit}</span>`, "Bugungi so'rov", 'text-green-400'),
    statCard(data.totalReq, "Jami so'rov", 'text-sky-400'),
  ].join('');

  document.getElementById('ap-pay').innerHTML =
    `To'lovlar: <span class="text-slate-300">${data.paidCount}</span> ta (${data.starsTotal} ⭐) · ` +
    `qo'lda berilgan: <span class="text-slate-300">${data.manualCount}</span> ta`;

  document.getElementById('ap-modes').innerHTML =
    Object.entries(data.byMode || {}).sort((a,b)=>b[1]-a[1])
      .map(([m,c]) => `<div class="flex justify-between text-sm py-1 border-b border-slate-700/50"><span class="text-slate-300">${esc(m)}</span><span class="text-indigo-300 font-medium">${c}</span></div>`)
      .join('') || '<div class="text-slate-500 text-sm">Ma\'lumot yo\'q</div>';

  const users = data.users || [];
  document.getElementById('ap-ucount').textContent =
    `(${users.length}${users.length >= 100 ? '+, qidiruvdan foydalaning' : ''})`;
  document.getElementById('ap-tbody').innerHTML =
    users.map(u => userRow(u, s.daily_limit)).join('')
    || '<tr><td colspan="10" class="py-3 text-slate-500 text-sm">Foydalanuvchi topilmadi</td></tr>';

  bindRowActions();
}

async function refreshUsers() {
  const { ok, status, data } = await api('stats', { q: view.q, ent: view.ent });
  if (!ok || !data.ok) {
    if (status === 401) { auth = { username: '', password: '' }; return renderLogin(); }
    return toast(data.message || "Ro'yxat yangilanmadi", 'error');
  }
  fillData(data);
}

function bindRowActions() {
  document.querySelectorAll('.lim-save').forEach(btn => {
    btn.onclick = async () => {
      const uid = btn.dataset.uid;
      const input = document.querySelector(`.lim-in[data-uid="${uid}"]`);
      const raw = input.value.trim();
      const limit = raw === '' ? null : Number(raw);
      if (limit !== null && (!Number.isInteger(limit) || limit < 0)) {
        return toast("Limit 0 yoki musbat butun son bo'lishi kerak", 'error');
      }
      btn.disabled = true;
      const { ok, data } = await api('set_user_limit', { userId: uid, limit });
      btn.disabled = false;
      if (!ok || !data.ok) return toast(data.message || 'Saqlanmadi', 'error');
      toast(limit === null ? 'Umumiy limitga qaytdi' : `Limit: ${limit}`, 'success');
    };
  });

  document.querySelectorAll('.gr-btn').forEach(btn => {
    btn.onclick = async () => {
      const uid = btn.dataset.uid;
      const days = Number(btn.dataset.days);
      if (days === -1 && !confirm('Obunani bekor qilamizmi? Foydalanuvchi darhol chegaralanadi.')) return;
      // Butun guruh bloklanadi — ikki marta bosish obunani ikki marta uzaytirmasin.
      const group = document.querySelectorAll(`.gr-btn[data-uid="${uid}"]`);
      group.forEach(b => { b.dataset.wasDisabled = b.disabled ? '1' : ''; b.disabled = true; });
      const { ok, data } = await api('grant_sub', { userId: uid, days });
      group.forEach(b => { b.disabled = b.dataset.wasDisabled === '1'; });
      if (!ok || !data.ok) return toast(data.message || 'Bajarilmadi', 'error');

      const cell = document.querySelector(`.ent-cell[data-uid="${uid}"]`);
      if (cell) cell.innerHTML = entBadge({ ent_state: data.ent, days_left: data.days_left });
      toast(data.subscription_until
        ? `Obuna: ${new Date(data.subscription_until).toLocaleDateString('uz')} gacha`
        : 'Obuna bekor qilindi', 'success');
      if (data.audit === false) toast("Diqqat: audit yozuvi yozilmadi", 'error');
    };
  });
}

renderLogin();
</script>
</body>
</html>
